<!doctype html>
<html lang="fr" data-theme="%lisiere.theme%">
	<head>
		<meta charset="utf-8" />
        <meta name="darkreader-lock" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
        <style>
            html { background: #101211; color: #eeeee9; color-scheme: dark; }
            html[data-theme="light"] { background: #fcfcfa; color: #20251f; color-scheme: only light; }
            body { background: inherit; color: inherit; }
        </style>
        <script>
            (() => {
                let theme = 'dark';
                try {
                    const saved = localStorage.getItem('lisiere-theme');
                    const serverTheme = document.documentElement.dataset.theme;
                    theme = saved === 'light' || saved === 'dark' ? saved : serverTheme === 'light' || serverTheme === 'dark' ? serverTheme : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                } catch {}
                document.documentElement.dataset.theme = theme;
                document.cookie = 'lisiere-theme=' + theme + '; Path=/; Max-Age=31536000; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
            })();
        </script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
